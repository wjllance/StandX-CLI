# Stage 3 v1 + external_guard + external_skew + microprice A/B, HYPE-USD.
# Baseline: nonlinear + external_guard + external_skew, NO microprice.
# Candidate: same baseline + [microprice] enabled.
# Band widened to 40bps to accommodate microprice cap=6.
# Band budget: spread(8) + nonlinear.cap(12) + external.cap(8) = 28 <= 40  (baseline)
#             spread(8) + nonlinear.cap(12) + external.cap(8) + micro.cap(6) = 34 <= 40  (candidate)
#
# Safety: microprice is fail-open (missing signal -> shift=0, quoting continues).
# Guardrails: capture drop >1bps, cancel rate +50%, position p95 up, uptime -2pp.

spread_bps = 8.0
band_bps = 40.0
size = 0.1
levels = 1
level_step_bps = 2.0
refresh_bps = 4.0
interval = 3

max_position = 1.0
skew_bps = 8.0
inventory_exit_pct = 0.0
inventory_exit_qty = 0.0
max_divergence_bps = 15.0
vol_pause_bps = 40.0
vol_window_secs = 60

stop_loss = 5.0
alert_loss = 2.5
alert_inventory_pct = 70.0
alert_position_change_pct = 20.0
alert_uptime = 60.0
alert_equity_below = 94.0
alert_margin_below = 30.0

no_ws = false
order_response_reconnect_attempts = 3
order_response_reconnect_backoff = 2
account_stream_reconnect_attempts = 3
account_stream_reconnect_backoff = 2

[adaptive_spread]
enabled = false
min_spread_bps = 8.0
max_spread_bps = 18.0

[[adaptive_spread.tiers]]
spread_bps = 8.0
refresh_bps = 4.0

[[adaptive_spread.tiers]]
enter_vol_bps = 10.0
exit_vol_bps = 7.0
spread_bps = 12.0
refresh_bps = 5.0

[[adaptive_spread.tiers]]
enter_vol_bps = 20.0
exit_vol_bps = 15.0
spread_bps = 18.0
refresh_bps = 6.0

[size_skew]
enabled = false
activate_pct = 30.0
release_pct = 20.0
add_side_factor = 0.5

# Stage 3 v1 nonlinear price skew.
[nonlinear_skew]
enabled = true
boost = 3.0
cap_bps = 12.0

# External-price defensive guard.
[external_guard]
enabled = true
enter_bps = 10.0
exit_bps = 5.0
max_age_ms = 5000
basis_half_life_secs = 300

# External-price center offset.
[external_skew]
enabled = true
lambda = 0.5
cap_bps = 8.0
dead_zone_bps = 1.0
