# Stage 3 v1 + external_guard + external_skew + microprice A/B, HYPE-USD.
# Baseline: nonlinear + external_guard + external_skew, NO microprice.
# Candidate: same baseline + [microprice] enabled.
# Band kept at 30bps (owner decision 2026-08-19): docs/30 made ±10bp two-sided
# in-band uptime a CONSTRAINT, and widening the strategy's own cancel band moves
# the wrong way.
# Band budget red line (docs/29, 2026-07-31): spread + ladder + inventory cap +
# external cap + microprice cap MUST be <= band_bps, enforced at STARTUP — the
# bot refuses to run otherwise, it does not silently clamp.
#   spread(8) + nonlinear.cap(12) + external.cap(8) + micro.cap(2) = 30 <= 30
# 2026-08-21 fix: micro.cap was 6, giving 34 > 30, so this config could not
# start at all after band went 40 -> 30 on 2026-08-19. The earlier comment here
# claimed the excess would "be clamped to the band edge, accepted, not a bug" —
# that contradicted the red line, which exists so a mechanism's configured
# strength can never be silently truncated (an A/B on a truncated shift is
# uninterpretable). microprice's cap was the one cut because its MAGNITUDE is
# explicitly unjudged (owner 2026-08-19: direction accepted, magnitude needs a
# fresh window), so shrinking it touches no accepted mechanism.
#
# Safety: microprice is fail-open (missing signal -> shift=0, quoting continues).
# Guardrails: capture drop >1bps, cancel rate +50%, position p95 up, uptime -2pp.

spread_bps = 8.0
band_bps = 30.0
size = 0.1
levels = 1
level_step_bps = 2.0
refresh_bps = 4.0
interval = 3

max_position = 1.0
skew_bps = 8.0
inventory_exit_pct = 0.0
inventory_exit_qty = 0.0
max_divergence_bps = 15.0
vol_pause_bps = 40.0
vol_window_secs = 60

stop_loss = 5.0
alert_loss = 2.5
alert_inventory_pct = 70.0
alert_position_change_pct = 20.0
alert_uptime = 60.0
alert_equity_below = 94.0
alert_margin_below = 30.0

no_ws = false
order_response_reconnect_attempts = 3
order_response_reconnect_backoff = 2
account_stream_reconnect_attempts = 3
account_stream_reconnect_backoff = 2

[adaptive_spread]
enabled = false
min_spread_bps = 8.0
max_spread_bps = 18.0

[[adaptive_spread.tiers]]
spread_bps = 8.0
refresh_bps = 4.0

[[adaptive_spread.tiers]]
enter_vol_bps = 10.0
exit_vol_bps = 7.0
spread_bps = 12.0
refresh_bps = 5.0

[[adaptive_spread.tiers]]
enter_vol_bps = 20.0
exit_vol_bps = 15.0
spread_bps = 18.0
refresh_bps = 6.0

[size_skew]
enabled = false
activate_pct = 30.0
release_pct = 20.0
add_side_factor = 0.5

# Stage 3 v1 nonlinear price skew.
[nonlinear_skew]
enabled = true
boost = 3.0
cap_bps = 12.0

# External-price defensive guard.
[external_guard]
enabled = true
enter_bps = 10.0
exit_bps = 5.0
max_age_ms = 5000
basis_half_life_secs = 300

# External-price center offset.
[external_skew]
enabled = true
lambda = 0.5
cap_bps = 8.0
dead_zone_bps = 1.0

# ─── Field-side mid-bias microprice shift (docs/31) ───
# cap=2 (was 6): forced by the band budget red line at band=30, see header.
# lambda=0.5, dead_zone=0.5 unchanged.
# Fail-open: signal missing/non-finite -> shift=0.
[microprice]
enabled = true
lambda = 0.5
cap_bps = 2.0
dead_zone_bps = 0.5
