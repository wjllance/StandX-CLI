name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'  # 推送 v 开头的 tag 时触发自动发布
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        description: Stable X.Y.Z version to publish from main
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # CI does not need debuginfo in test executables; this keeps the cached
  # target directory materially smaller without changing local profiles.
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: write

jobs:
  # 基础检查 (Linux x86_64)
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test release tooling
        run: python3 -m unittest scripts/test_release.py

      - name: Verify version metadata
        run: python3 scripts/release.py verify

      - name: Verify event tag matches the Cargo version
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: python3 scripts/release.py verify --tag "$RELEASE_TAG"

      - name: Guard requested stable release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must be a stable X.Y.Z value, got '$RELEASE_VERSION'"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::stable releases must run from main, got '$GITHUB_REF'"
            exit 1
          fi
          python3 scripts/release.py verify --tag "v$RELEASE_VERSION"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "::error::tag v$RELEASE_VERSION already exists"
            exit 1
          fi
          set +e
          release_check=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/v$RELEASE_VERSION" 2>&1)
          release_status=$?
          set -e
          if [ "$release_status" -eq 0 ]; then
            echo "::error::release v$RELEASE_VERSION already exists"
            exit 1
          fi
          if ! printf '%s\n' "$release_check" | grep -q '(HTTP 404)'; then
            echo "::error::could not verify that release v$RELEASE_VERSION is absent"
            printf '%s\n' "$release_check"
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test standalone installer
        run: |
          sh -n install.sh
          sh scripts/test_install.sh

  # 多平台构建矩阵
  build-matrix:
    strategy:
      matrix:
        include:
          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          # Linux ARM64 (交叉编译)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for ARM64 Linux)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (native)
        if: '!matrix.cross'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        env:
          RUSTFLAGS: "-C linker=aarch64-linux-gnu-gcc"
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: Verify native binary version
        if: '!matrix.cross'
        run: >-
          python3 scripts/release.py verify
          --binary target/${{ matrix.target }}/release/standx

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: standx-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/standx

  # 发布 Release (手动创建 release 时触发)
  release:
    needs: [check, build-matrix]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || inputs.version != ''
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: release-tag
        env:
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            echo "tag=v$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$EVENT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Recheck guarded stable release target
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          python3 scripts/release.py verify --tag "$RELEASE_TAG"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::tag $RELEASE_TAG appeared while the release was building"
            exit 1
          fi
          set +e
          release_check=$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)
          release_status=$?
          set -e
          if [ "$release_status" -eq 0 ]; then
            echo "::error::release $RELEASE_TAG appeared while the release was building"
            exit 1
          fi
          if ! printf '%s\n' "$release_check" | grep -q '(HTTP 404)'; then
            echo "::error::could not verify that release $RELEASE_TAG is absent"
            printf '%s\n' "$release_check"
            exit 1
          fi

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Package binaries
        env:
          VERSION: ${{ steps.release-tag.outputs.tag }}
        run: |
          mkdir -p ./packages

          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            binary="./binaries/standx-${target}/standx"
            if [ ! -f "$binary" ]; then
              echo "::error::missing required release binary $binary"
              exit 1
            fi
            chmod +x "$binary"
            tar -czf "./packages/standx-${VERSION}-${target}.tar.gz" -C "./binaries/standx-${target}" standx
            echo "Packaged: standx-${VERSION}-${target}.tar.gz"
          done

      - name: Generate checksums
        run: |
          cd ./packages
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload install.sh to release
        run: |
          cp install.sh ./packages/

      - name: Read guarded stable release notes
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py notes --version "$RELEASE_VERSION" > release-notes.md

      - name: Upload to existing release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./packages/*.tar.gz
            ./packages/checksums.txt
            ./packages/install.sh
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish guarded stable release
        if: inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release-tag.outputs.tag }}
          body_path: release-notes.md
          prerelease: false
          files: |
            ./packages/*.tar.gz
            ./packages/checksums.txt
            ./packages/install.sh
          token: ${{ secrets.GITHUB_TOKEN }}

  # 自动发布 Pre-release (推送 tag 时触发)
  auto-prerelease:
    needs: [check, build-matrix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-')
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: ./binaries

      - name: Package binaries
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p ./packages

          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            binary="./binaries/standx-${target}/standx"
            if [ ! -f "$binary" ]; then
              echo "::error::missing required prerelease binary $binary"
              exit 1
            fi
            chmod +x "$binary"
            tar -czf "./packages/standx-${VERSION}-${target}.tar.gz" -C "./binaries/standx-${target}" standx
            echo "Packaged: standx-${VERSION}-${target}.tar.gz"
          done

      - name: Generate checksums
        run: |
          cd ./packages
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Read release notes
        id: notes
        run: |
          # No standalone RELEASE_NOTES_<tag>.md file (retired 2026-07-30):
          # notes come from CHANGELOG.md's "## [X.Y.Z]" section for the base
          # version, with any `-rc.N` / prerelease suffix stripped. Empty if
          # that section doesn't exist yet (e.g. an rc tag cut ahead of the
          # CHANGELOG entry).
          VERSION="${GITHUB_REF#refs/tags/}"
          BASE_VERSION="${VERSION#v}"
          BASE_VERSION="${BASE_VERSION%%-*}"
          NOTES="$(awk -v ver="$BASE_VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag { print }
          ' CHANGELOG.md)"
          if [ -n "$NOTES" ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create/Update Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: true
          files: |
            ./packages/*.tar.gz
            ./packages/checksums.txt

  # 更新 Homebrew (稳定版发布时触发)
  update-homebrew:
    needs: release
    runs-on: ubuntu-latest
    if: >-
      inputs.version != '' ||
      (github.event_name == 'release' && !contains(github.event.release.tag_name, '-'))
    steps:
      # Fail loudly on a missing secret. The previous
      # `HOMEBREW_TAP_TOKEN || GITHUB_TOKEN` fallback silently degraded to a
      # token that cannot reach another repository, so "secret not configured"
      # surfaced as `Bad credentials` — which reads like a permissions problem
      # and cost real debugging time on both the v1.1.0 and v1.2.0 releases.
      # `secrets` is not available in a job-level `if`, so this is a step.
      - name: Require the tap token
        run: |
          if [ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not configured, so the Homebrew tap cannot be updated. Add a token with contents:write on wjllance/homebrew-standx-cli (Settings > Secrets and variables > Actions), then re-run this job. The release itself is already published; only the formula is stale."
            exit 1
          fi

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: wjllance/homebrew-standx-cli
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download source tarball
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          curl -L -o standx-cli.tar.gz "https://github.com/wjllance/standx-cli/archive/refs/tags/${RELEASE_TAG}.tar.gz"
          SHA256=$(sha256sum standx-cli.tar.gz | cut -d' ' -f1)
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "VERSION=$RELEASE_TAG" >> $GITHUB_ENV

      - name: Update Homebrew formula
        run: |
          cd homebrew-tap
          sed -i "s|url \"https://github.com/wjllance/standx-cli/archive/refs/tags/v.*.tar.gz\"|url \"https://github.com/wjllance/standx-cli/archive/refs/tags/${{ env.VERSION }}.tar.gz\"|" Formula/standx-cli.rb
          sed -i "s|sha256 \"[^\"]*\"|sha256 \"${{ env.SHA256 }}\"|" Formula/standx-cli.rb
          # A sed whose pattern stops matching (formula reformatted, url moved)
          # would leave the formula untouched and still exit 0. Assert the two
          # values we came here to write are actually present.
          grep -q "archive/refs/tags/${{ env.VERSION }}.tar.gz" Formula/standx-cli.rb || {
            echo "::error::formula url was not rewritten to ${{ env.VERSION }}; check the sed patterns against the current Formula/standx-cli.rb"
            exit 1
          }
          grep -q "sha256 \"${{ env.SHA256 }}\"" Formula/standx-cli.rb || {
            echo "::error::formula sha256 was not rewritten; check the sed patterns against the current Formula/standx-cli.rb"
            exit 1
          }

      - name: Commit and push to tap
        run: |
          cd homebrew-tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/standx-cli.rb
          git commit -m "Update standx-cli to ${{ env.VERSION }}"
          git push
